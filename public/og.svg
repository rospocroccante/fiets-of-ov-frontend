<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Fiets of OV">
  <title>Fiets of OV</title>
  <!-- Source for og.png, the 1200x630 card that link previews show (see the Open Graph
       block in index.html). Regenerate the PNG after editing; the note in index.html
       has the command. Text is baked in, so it stays Dutch: the document's default
       language is nl and the preview is not translated per reader. -->
  <rect width="1200" height="630" fill="#0D4A73" />
  <!-- A single lighter wash so the card is not one flat rectangle. -->
  <circle cx="1080" cy="90" r="380" fill="#FFFFFF" opacity="0.05" />

  <g transform="translate(96 171) scale(4.5)">
    <!-- Tram: body, window band, and the pantograph nub on the roof. -->
    <rect x="18" y="7" width="28" height="23" rx="5" fill="#FFC917" />
    <rect x="23" y="12" width="18" height="9" rx="2" fill="#0D4A73" />
    <rect x="30" y="3" width="4" height="4" rx="1" fill="#FFC917" />
    <rect x="22" y="25" width="6" height="3" rx="1.5" fill="#0D4A73" />
    <rect x="36" y="25" width="6" height="3" rx="1.5" fill="#0D4A73" />

    <!-- Bicycle: two wheels and a diamond frame in white. -->
    <g fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="17" cy="48" r="9" />
      <circle cx="47" cy="48" r="9" />
      <path d="M17 48 L30 36 L47 48" />
      <path d="M30 36 L30 48 L17 48" />
      <path d="M43 36 L47 48" />
      <path d="M39 35 L46 35" />
    </g>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#FFFFFF">
    <text x="440" y="285" font-size="88" font-weight="700">Fiets of OV</text>
    <text x="440" y="360" font-size="38" font-weight="400" fill="#BBD3E4">
      Regenbewust reisadvies voor Amsterdam
    </text>
  </g>
  <rect x="440" y="400" width="120" height="6" rx="3" fill="#FFC917" />
</svg>
